<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta charset="utf-8">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            // Ẩn thông báo khi focus vào ô nhập
            $("#us, #pw").focus(function () {
                $("#nt").slideUp("fast").html("");
            });

            $("#sm").click(function (event) {
                var user = $("#us").val().trim();
                var pass = $("#pw").val().trim();

                if (user === "" || pass === "") {
                    $("#nt").css("display", "block").slideDown("slow");
                    $("#nt").html("<span style='color:red;'>&#9888; Vui lòng nhập đầy đủ thông tin!</span>");
                    return;
                }

                $.get(
                    "check.php",
                    { user: user, pass: pass },
                    function (data) {
                        $("#nt").css("display", "block").slideDown("slow");
                        $("#nt").html(data);
                    }
                );
            });

            // Nhấn Enter trong ô mật khẩu → submit
            $("#pw").keypress(function (e) {
                if (e.which === 13) {
                    $("#sm").click();
                }
            });
        });
    </script>
    <style>
        body {
            margin: 80px 200px;
            font: normal 14pt Arial;
            color: navy;
        }

        input {
            border: solid 1px silver;
            padding: 3px;
            font: normal 14pt Arial;
            color: blue;
            padding: 3px 5px;
        }

        fieldset {
            border: solid 2px green;
            border-radius: 8px;
            width: 335px;
            background-color: #DAFEF3;
        }

        #nt {
            width: 335px;
            border: solid 1px silver;
            padding: 10px 15px;
            font: normal 14pt Arial;
            color: green;
            background-color: yellow;
            box-shadow: 2px 2px black;
            display: none;
        }

        legend {
            color: red;
        }

        input[type=button] {
            float: right;
            padding: 5px 10px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }

        input[type=button]:hover {
            background-color: #45a049;
        }

        table td {
            padding: 6px 4px;
        }
    </style>
</head>
<body>
    <fieldset>
        <img src='images/dhdn.gif' onerror="this.style.display='none'" />
        <hr>
        <legend><b>LOGIN</b></legend>
        <table>
            <tr>
                <td style="width:30%">User name</td>
                <td style="width:70%">
                    <input type="text" id="us" placeholder="Tên đăng nhập">
                </td>
            </tr>
            <tr>
                <td>Password</td>
                <td>
                    <input type="password" id="pw" placeholder="Mật khẩu">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <br>
                    <input id="sm" type="button" value="Submit">
                </td>
            </tr>
        </table>
    </fieldset>
    <br>
    <div id="nt">Notice:</div>
</body>
</html>
